<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b2a4a">
<title>Build Your Own Tower Defense</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1b2a4a;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
:root{--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);--safe-b:env(safe-area-inset-bottom,0px)}
#root{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;container-type:size;container-name:root;transform-origin:0 0}
body.portrait #root{transform:rotate(90deg) translateY(-100%)}
#root>*{font-size:clamp(11px,1.45cqmin + 4px,17px)}
.btn{border:0;border-radius:14px;padding:.65em 1.1em;font-weight:900;font-size:1em;color:#fff;letter-spacing:.02em;
  background:linear-gradient(#4fa3ff,#2c6fe0);box-shadow:0 4px 0 #1a4ba3,0 6px 14px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .08s,filter .15s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1a4ba3}
.btn:hover{filter:brightness(1.08)}
.btn.small{padding:.45em .8em;border-radius:11px;font-size:.92em}
.btn.green{background:linear-gradient(#5fe07a,#2fae4a);box-shadow:0 4px 0 #1f7a33,0 6px 14px rgba(0,0,0,.3)}
.btn.red{background:linear-gradient(#ff6a6a,#d93a3a);box-shadow:0 4px 0 #962323,0 6px 14px rgba(0,0,0,.3)}
.btn.gold{background:linear-gradient(#ffd84a,#f0a81a);box-shadow:0 4px 0 #a86f00,0 6px 14px rgba(0,0,0,.3);color:#4a2a00;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.purple{background:linear-gradient(#b47aff,#7a3ae0);box-shadow:0 4px 0 #4f1fa0,0 6px 14px rgba(0,0,0,.3)}
.btn.gray{background:linear-gradient(#8a93a6,#5c6478);box-shadow:0 4px 0 #3a4050}
.btn:disabled{filter:grayscale(.8) brightness(.8);cursor:default}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
#loading{background:radial-gradient(circle at 50% 40%,#3a6ad8,#1b2a4a);z-index:100}
.logo{display:flex;flex-direction:column;align-items:center;transform:rotate(-2deg);filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.logo .l1{font-size:clamp(16px,3.6cqmin,34px);font-weight:900;color:#ffe14d;-webkit-text-stroke:2px #6a3a00;letter-spacing:.08em}
.logo .l2{font-size:clamp(30px,8cqmin,78px);font-weight:900;color:#fff;-webkit-text-stroke:3px #1a3a8a;line-height:.95;background:linear-gradient(#fff,#bfe2ff);-webkit-background-clip:text;background-clip:text}
.logo.small .l2{font-size:clamp(26px,7cqmin,64px)}
.loadbar{width:min(60cqw,420px);height:18px;border-radius:10px;background:rgba(0,0,0,.35);margin-top:24px;overflow:hidden;border:3px solid rgba(255,255,255,.5)}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fe07a,#ffe14d);transition:width .2s}
.loadtxt{margin-top:10px;opacity:.85;font-weight:700}
/* Hauptmenü */
#mainmenu{background:linear-gradient(90deg,rgba(10,20,50,.55),rgba(10,20,50,0) 45%,rgba(10,20,50,0) 70%,rgba(10,20,50,.25));align-items:flex-start;padding-left:calc(4cqw + var(--safe-l));gap:2cqmin}
#mainmenu .logo{align-items:flex-start;margin-top:4cqmin}
.menu-buttons{display:flex;flex-direction:column;gap:1.6cqmin;width:min(46cqw,460px)}
.btn.big{font-size:1.6em;padding:.55em 1em;border-radius:18px}
.btn.play{background:linear-gradient(#5fe07a,#22a03c);box-shadow:0 6px 0 #16702a,0 8px 20px rgba(0,0,0,.35);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4cqmin}
.menu-grid .btn{font-size:.92em;padding:.7em .5em}
.menu-top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + var(--safe-r));display:flex;gap:10px;align-items:center}
.menu-foot{position:fixed;bottom:8px;left:calc(4cqw + var(--safe-l));opacity:.7;font-size:.8em}
.daily-btn{position:fixed;right:calc(16px + var(--safe-r));bottom:calc(16px + var(--safe-b));border:0;border-radius:16px;padding:.8em 1.1em;font-weight:900;font-size:1em;color:#4a2a00;background:linear-gradient(#ffe46a,#ffb320);box-shadow:0 5px 0 #a86f00;animation:pulse 1.6s infinite}
.daily-btn.done{animation:none;filter:grayscale(.7);opacity:.8}
.player-chip{display:flex;align-items:center;gap:.5em;background:rgba(15,25,55,.72);border:2px solid rgba(255,255,255,.25);border-radius:16px;padding:.35em .7em .35em .35em;backdrop-filter:blur(4px)}
.player-chip .av{width:2.3em;height:2.3em;border-radius:12px;background:linear-gradient(#ffd84a,#ff8a3a);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.05em;color:#5a2a00;border:2px solid #fff}
.player-chip .nm{font-weight:900;line-height:1.1}
.player-chip .lv{font-size:.78em;opacity:.9}
.xpbar{width:8em;height:.55em;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:2px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7af0ff,#3aa0ff)}
.cur-row{display:flex;gap:8px}
.res{display:flex;align-items:center;gap:.35em;background:rgba(15,25,55,.72);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:.3em .7em;font-weight:900;min-width:4.6em}
.res b{font-size:1.05em}
.res.coins b{color:#ffe14d}.res.gems b{color:#8fe9ff}.res.lives b{color:#ff7a8a}.res.crys b{color:#e8a3ff}
.res.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.15)}}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
.hud-tl{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + var(--safe-l))}
.hud-tr{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + var(--safe-r));display:flex;gap:6px;align-items:center}
.hud-tc{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none!important}
.wave-panel{background:rgba(15,25,55,.75);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:.35em .8em;min-width:15em;pointer-events:none}
.wp-row{display:flex;justify-content:space-between;gap:1em;align-items:center}
.wp-row b{font-size:1.1em;color:#ffe14d}
.wp-row.small{font-size:.8em;opacity:.95}
.wp-bar{height:.55em;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden;margin:3px 0}
.wp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7a3a,#ffe14d);transition:width .2s}
.boss-bar{background:rgba(40,5,15,.85);border:2px solid #ff4d6a;border-radius:12px;padding:.3em .7em;width:min(46cqw,440px)}
.bb-name{font-weight:900;color:#ffb3c0;text-align:center;font-size:.95em}
.bb-track{position:relative;height:.8em;border-radius:6px;background:rgba(0,0,0,.5);overflow:hidden;margin-top:2px}
.bb-track i{position:absolute;left:0;top:0;height:100%}
#bbFill{background:linear-gradient(90deg,#ff2a4a,#ff8a3a)}
#bbShield{background:rgba(90,176,255,.8);height:35%!important}
.side-menu{position:fixed;right:calc(8px + var(--safe-r));top:calc(62px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
.sbtn{position:relative;width:2.7em;height:2.7em;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(15,25,55,.72);font-size:1.05em;color:#fff}
.sbtn:active{transform:scale(.92)}
.dot{position:absolute;top:-3px;right:-3px;width:.8em;height:.8em;border-radius:50%;background:#ff3b5a;border:2px solid #fff}
.cam-ctl{position:fixed;left:calc(8px + var(--safe-l));top:calc(70px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:1fr 1fr;gap:5px}
.cbtn{width:2.5em;height:2.5em;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(15,25,55,.6);color:#fff;font-weight:900;font-size:1.05em}
.cbtn:last-child{grid-column:span 2;width:auto}
.wave-ctl{position:fixed;right:calc(8px + var(--safe-r));bottom:calc(8px + var(--safe-b));display:flex;flex-direction:column;gap:6px;align-items:stretch;width:min(30cqw,210px)}
.wavebtn{background:linear-gradient(#ff8a3a,#e0501a);box-shadow:0 4px 0 #9a3010,0 6px 14px rgba(0,0,0,.3);font-size:1em;padding:.7em .4em}
.wavebtn.skip{background:linear-gradient(#b47aff,#7a3ae0);box-shadow:0 4px 0 #4f1fa0}
.wc-row{display:flex;gap:6px}.wc-row .btn{flex:1}
.build-bar{position:fixed;left:calc(8px + var(--safe-l));right:calc(min(30cqw,210px) + 18px + var(--safe-r));bottom:calc(8px + var(--safe-b));background:rgba(15,25,55,.78);border:2px solid rgba(255,255,255,.25);border-radius:16px;padding:5px;backdrop-filter:blur(4px)}
.bb-tabs{display:flex;gap:4px;margin-bottom:5px}
.bb-tabs button{flex:1;border:0;border-radius:10px;padding:.35em .2em;font-weight:900;font-size:.85em;color:#cfe0ff;background:rgba(255,255,255,.08)}
.bb-tabs button.on{background:linear-gradient(#4fa3ff,#2c6fe0);color:#fff}
.bb-items{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding-bottom:2px;touch-action:pan-x}
.bb-items::-webkit-scrollbar{height:5px}.bb-items::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:3px}
.item{flex:0 0 auto;width:4.9em;border-radius:12px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.15);padding:3px;text-align:center;position:relative;color:#fff}
.item img,.item .ic{width:100%;height:3.1em;object-fit:contain;display:flex;align-items:center;justify-content:center;font-size:1.9em}
.item .nm{font-size:.62em;font-weight:800;line-height:1.05;height:2.2em;overflow:hidden;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.item .pr{font-size:.75em;font-weight:900;color:#ffe14d}
.item .pr.no{color:#ff7a7a}
.item.sel{border-color:#ffe14d;background:rgba(255,225,77,.22);box-shadow:0 0 0 2px #ffe14d inset}
.item.locked{filter:grayscale(1) brightness(.6)}
.item .lock{position:absolute;top:2px;right:4px;font-size:.9em}
.item .rar{position:absolute;left:3px;top:3px;width:.6em;height:.6em;border-radius:50%}
.build-hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:11;background:rgba(15,25,55,.85);border-radius:12px;padding:.4em .9em;font-weight:700;font-size:.85em;display:flex;gap:.6em;align-items:center;white-space:nowrap}
.build-hint .btn{pointer-events:auto}
/* Turm-Panel */
.tower-panel{position:fixed;left:calc(8px + var(--safe-l));top:calc(70px + env(safe-area-inset-top,0px));width:min(38cqw,300px);max-height:calc(100% - 78px);overflow:auto;background:rgba(15,25,55,.92);border:3px solid #ffe14d;border-radius:18px;padding:.7em;z-index:12}
.tp-head{display:flex;gap:.6em;align-items:center}
.tp-head img{width:3.6em;height:3.6em;border-radius:12px;background:rgba(255,255,255,.08)}
.tp-name{font-weight:900;font-size:1.05em;line-height:1.1}
.tp-lv{display:flex;gap:3px;margin-top:3px}
.tp-lv i{width:1.1em;height:.5em;border-radius:3px;background:rgba(255,255,255,.2)}
.tp-lv i.on{background:#ffe14d}
.tp-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:.6em 0;font-size:.85em}
.tp-stats div{background:rgba(255,255,255,.07);border-radius:8px;padding:.25em .45em}
.tp-stats b{color:#ffe14d}
.tp-stats .up{color:#5fe07a;font-size:.85em}
.tp-spec{font-size:.8em;opacity:.9;margin-bottom:.5em}
.tp-target{display:flex;gap:3px;margin-bottom:.6em}
.tp-target button{flex:1;border:0;border-radius:8px;padding:.3em 0;font-size:.72em;font-weight:800;color:#cfe0ff;background:rgba(255,255,255,.1)}
.tp-target button.on{background:#2c6fe0;color:#fff}
.tp-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tp-btns .btn{padding:.6em .3em;font-size:.95em}
.tp-btns .wide{grid-column:span 2}
.tp-close{position:absolute;top:6px;right:8px;border:0;background:none;color:#fff;font-size:1.2em}
/* Toasts & Banner */
#toasts{position:fixed;top:calc(112px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60;pointer-events:none}
.toast{background:rgba(15,25,55,.92);border:2px solid rgba(255,255,255,.35);border-radius:12px;padding:.45em 1em;font-weight:800;animation:tin .25s;max-width:80cqw;text-align:center}
.toast.good{border-color:#5fe07a}.toast.bad{border-color:#ff6a6a}.toast.gold{border-color:#ffd84a;background:rgba(80,50,0,.92)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:55;pointer-events:none}
#banner .t1{font-size:clamp(34px,9cqmin,90px);font-weight:900;color:#fff;-webkit-text-stroke:3px #1a3a8a;animation:bin .5s ease-out;text-align:center}
#banner .t2{font-size:clamp(16px,3.5cqmin,30px);font-weight:900;color:#ffe14d;-webkit-text-stroke:1px #6a3a00}
#banner.boss .t1{color:#ff5a6a;-webkit-text-stroke-color:#3a0010}
@keyframes bin{from{transform:scale(2.2);opacity:0}}
.float-text{position:fixed;left:0;top:0;font-weight:900;font-size:1em;pointer-events:none;-webkit-text-stroke:1px rgba(0,0,0,.6);z-index:9;white-space:nowrap}
#floats{position:fixed;inset:0;pointer-events:none;z-index:9}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(5,10,30,.6);display:flex;align-items:center;justify-content:center;z-index:70;backdrop-filter:blur(3px)}
.modal-box{width:min(94cqw,980px);height:min(92cqh,720px);background:linear-gradient(#24386a,#172449);border:3px solid rgba(255,255,255,.35);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:mpop .2s}
@keyframes mpop{from{transform:scale(.9);opacity:0}}
.modal-box.compact{height:auto;max-height:92cqh;width:min(94cqw,560px)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:.5em .9em;background:rgba(0,0,0,.22)}
.modal-head h2{margin:0;font-size:1.3em;font-weight:900;color:#ffe14d;-webkit-text-stroke:1px #6a3a00}
.xbtn{border:0;background:linear-gradient(#ff6a6a,#d93a3a);color:#fff;font-weight:900;border-radius:10px;width:2.2em;height:2.2em;font-size:1em;box-shadow:0 3px 0 #962323}
.modal-body{flex:1;overflow:auto;padding:.8em;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.6em}
.tabs button{border:0;border-radius:10px;padding:.45em .8em;font-weight:900;color:#cfe0ff;background:rgba(255,255,255,.1);font-size:.9em}
.tabs button.on{background:linear-gradient(#4fa3ff,#2c6fe0);color:#fff}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.6em}
.filters input,.filters select,.set-row input[type=text]{border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.3);color:#fff;border-radius:10px;padding:.45em .6em;font-size:.9em;font-family:inherit;user-select:text;-webkit-user-select:text}
.filters input{flex:1;min-width:8em}
.filters select option{background:#24386a}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.4em,1fr));gap:8px}
.card{position:relative;border-radius:14px;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.2);padding:.4em;text-align:center;cursor:pointer}
.card img,.card .ic{width:100%;height:5.4em;object-fit:contain;display:flex;align-items:center;justify-content:center;font-size:3em}
.card .nm{font-weight:900;font-size:.85em;line-height:1.15;min-height:2.3em;display:flex;align-items:center;justify-content:center}
.card .sub{font-size:.72em;opacity:.85}
.card .rb{display:inline-block;font-size:.66em;font-weight:900;border-radius:6px;padding:1px 6px;margin-top:3px;color:#111}
.card.locked img,.card.locked .ic{filter:grayscale(1) brightness(.4)}
.card .tag{position:absolute;top:4px;right:6px;font-size:.75em;font-weight:900}
.card.eq{box-shadow:0 0 0 3px #5fe07a inset}
.card .buy{margin-top:4px;width:100%}
.detail{display:flex;gap:1em;align-items:flex-start;background:rgba(0,0,0,.2);border-radius:14px;padding:.7em;margin-bottom:.7em}
.detail img{width:7em;height:7em;border-radius:14px;background:rgba(255,255,255,.06)}
.detail h3{margin:0 0 .2em;font-size:1.15em}
.detail p{margin:.2em 0;font-size:.88em;opacity:.92}
table.lvt{border-collapse:collapse;font-size:.8em;margin-top:.4em}
table.lvt td,table.lvt th{padding:2px 8px;border-bottom:1px solid rgba(255,255,255,.12);text-align:right}
table.lvt th{color:#ffe14d}
.qlist{display:flex;flex-direction:column;gap:8px}
.quest{display:flex;align-items:center;gap:.8em;background:rgba(255,255,255,.08);border-radius:14px;padding:.55em .8em;border:2px solid rgba(255,255,255,.15)}
.quest .qi{font-size:1.8em}
.quest .qb{flex:1}
.quest .qn{font-weight:900}
.quest .qd{font-size:.82em;opacity:.9}
.pbar{height:.6em;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#5fe07a,#ffe14d)}
.quest .qr{font-size:.8em;font-weight:900;color:#8fe9ff;white-space:nowrap}
.quest.done{opacity:.6}
.quest.ready{border-color:#ffe14d;background:rgba(255,225,77,.12)}
h4.sec{margin:.6em 0 .4em;color:#8fe9ff;font-size:1em}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:.5em .2em;border-bottom:1px solid rgba(255,255,255,.1)}
.set-row input[type=range]{width:45%}
.set-row select{border:2px solid rgba(255,255,255,.3);background:#24386a;color:#fff;border-radius:10px;padding:.35em .5em;font-family:inherit}
.toggle{width:3.2em;height:1.7em;border-radius:1em;background:rgba(255,255,255,.2);border:0;position:relative}
.toggle::after{content:"";position:absolute;top:.2em;left:.2em;width:1.3em;height:1.3em;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:#2fae4a}.toggle.on::after{left:1.7em}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13em,1fr));gap:6px}
.statgrid div{background:rgba(255,255,255,.08);border-radius:10px;padding:.45em .7em;display:flex;justify-content:space-between}
.statgrid b{color:#ffe14d}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(10em,1fr));gap:8px}
.mode{border-radius:16px;padding:.7em;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.2);text-align:center;cursor:pointer}
.mode .mi{font-size:2.2em}.mode .mn{font-weight:900}.mode .md{font-size:.78em;opacity:.9;min-height:2.6em}
.mode.on{border-color:#ffe14d;background:rgba(255,225,77,.14)}
.mode.locked{filter:grayscale(1);opacity:.6}
.biomes{display:flex;gap:8px;flex-wrap:wrap}
.biome{border-radius:14px;padding:.5em .7em;border:3px solid rgba(255,255,255,.2);font-weight:900;font-size:.85em;cursor:pointer;min-width:7em;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.biome.on{border-color:#ffe14d;box-shadow:0 0 0 2px #ffe14d}
.biome.locked{filter:grayscale(1) brightness(.6)}
.result{text-align:center}
.result .big{font-size:2.4em;font-weight:900;color:#ffe14d;-webkit-text-stroke:2px #6a3a00}
.result .statgrid{margin:1em 0}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
textarea.code{width:100%;height:6em;border-radius:10px;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.3);color:#fff;font-family:monospace;font-size:.75em;padding:.5em;user-select:text;-webkit-user-select:text}
.note{font-size:.82em;opacity:.85;background:rgba(0,0,0,.2);border-radius:10px;padding:.5em .7em;margin:.5em 0}
.visit-bar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;background:rgba(15,25,55,.9);border:2px solid #ffe14d;border-radius:14px;padding:.5em .8em;display:flex;gap:.6em;align-items:center;font-weight:800}
@container root (max-height:430px){
  :root{--ui:12px}
  .item{width:4.3em}.item img,.item .ic{height:2.5em;font-size:1.6em}
  .wave-panel{min-width:12em}
  .side-menu{gap:4px}.sbtn{width:2.4em;height:2.4em}
  .cam-ctl{top:calc(58px + env(safe-area-inset-top,0px))}.cam-ctl .cbtn{width:2.3em;height:2.3em}
  .tower-panel{top:56px;max-height:calc(100% - 64px);width:min(44cqw,300px);padding:.5em}
  body.tp-open .build-bar,body.tp-open .build-hint{display:none}
  .tp-stats{margin:.4em 0}
  #toasts{top:calc(108px + env(safe-area-inset-top,0px))}
  .build-hint{top:calc(58px + env(safe-area-inset-top,0px))}
  .modal-box{height:96cqh}

}
@container root (max-width:700px){.build-bar{right:calc(30cqw + 14px)}}

/* Spielfigur-Steuerung */
.joy{position:fixed;left:calc(18px + var(--safe-l));bottom:calc(16px + var(--safe-b));width:128px;height:128px;border-radius:50%;background:rgba(15,25,55,.35);border:3px solid rgba(255,255,255,.45);touch-action:none;display:none}
.joy-knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bcd4ff);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.jump-btn{position:fixed;right:calc(min(30cqw,210px) + 22px + var(--safe-r));bottom:calc(18px + var(--safe-b));width:76px;height:76px;border-radius:50%;border:3px solid rgba(255,255,255,.6);background:rgba(15,25,55,.55);color:#fff;font-size:1.9em;font-weight:900;line-height:.9;display:none;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
.jump-btn small{font-size:.32em}
.jump-btn:active{transform:scale(.92);background:rgba(79,163,255,.6)}
.build-toggle{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));display:none}
.build-toggle:active{transform:translateX(-50%) translateY(3px)}
.bb-tabs .bb-close{flex:0 0 2.4em;background:linear-gradient(#ff6a6a,#d93a3a);color:#fff}
body:not(.build-open) .build-bar{display:none}
body:not(.build-open) #hud .build-toggle{display:block}
body.touch:not(.build-open):not(.tp-open) #hud .joy{display:block}
body.touch:not(.build-open) #hud .jump-btn{display:flex}
#camMode{font-size:.8em}
.picks{margin:.8em 0;background:rgba(255,225,77,.1);border:2px solid #ffe14d;border-radius:16px;padding:.6em}
.picks h3{margin:.1em 0 .4em;color:#ffe14d}
.pick-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:.6em}
.pick-row .card{border-width:3px}.pick-row .card img{height:3.2em}.pick-row .card .sub{font-size:.68em}
.pick-row.done .card{opacity:.35;pointer-events:none}
.pick-row.done .card.chosen{opacity:1;box-shadow:0 0 0 4px #5fe07a;animation:pulse 1.2s infinite}
.swatches{display:flex;gap:6px}
.swatches button{width:2em;height:2em;border-radius:8px;border:3px solid rgba(255,255,255,.3)}
.swatches button.on{border-color:#fff;box-shadow:0 0 0 2px #ffe14d}

/* Tutorial */
#tut{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:58;width:min(560px,70cqw);background:linear-gradient(#fff8d6,#ffe9a0);color:#3a2a00;border:3px solid #ffb320;border-radius:18px;padding:.6em .8em;display:flex;gap:.7em;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#tut.pop{animation:mpop .25s}
#tut .tut-face{font-size:2.2em}
#tut .tut-text{flex:1;font-size:1em;line-height:1.35}
#tut .btn{white-space:nowrap}
.tut-hl{outline:4px solid #ffe14d!important;outline-offset:2px;animation:tutpulse 1s infinite;z-index:5}
@keyframes tutpulse{50%{outline-color:#ff8a1a;outline-offset:6px}}
body.tutorial .side-menu,body.tutorial .hud-tr .shopbtn,body.tutorial .wc-row,body.tutorial [data-tp=sell]{display:none!important}
.item.info{width:11em;text-align:left;font-size:.8em;padding:.4em;opacity:.95;display:flex;align-items:center}
.item.info.big{width:9em;font-size:.95em;flex-direction:column;align-items:flex-start;justify-content:center}
/* Boss-Truhe */
.roulette{position:relative;overflow:hidden;border:3px solid #ffe14d;border-radius:14px;background:rgba(0,0,0,.35);margin:.6em 0}
.rl-strip{display:flex;gap:0;height:100%;will-change:transform}
.rl-card{flex:0 0 7em;height:7.4em;overflow:hidden;margin:.4em .25em;border:3px solid;border-radius:12px;background:rgba(255,255,255,.08);text-align:center;padding:.2em}
.rl-card img{width:100%;height:5em;object-fit:contain;display:block}.rl-card .ic{height:1.92em;font-size:2.6em;display:flex;align-items:center;justify-content:center}
.rl-card .nm{font-size:.72em;font-weight:900;line-height:1.1}
.rl-card.won{background:rgba(255,225,77,.35);box-shadow:0 0 18px #ffe14d}
.rl-line{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#ff3b5a;z-index:2;box-shadow:0 0 8px #ff3b5a}
.rl-win h3{margin:.3em 0;font-size:1.25em}
.rl-win .bonus{background:rgba(255,225,77,.15);border:2px dashed #ffe14d;border-radius:10px;padding:.35em .6em;display:inline-block}
</style>
</head>
<body>
<div id="root">
<canvas id="c"></canvas>
<div id="floats"></div>

<!-- Ladebildschirm -->
<div id="loading" class="screen">
  <div class="logo"><span class="l1">BUILD YOUR OWN</span><span class="l2">TOWER DEFENSE</span></div>
  <div class="loadbar"><i id="loadfill"></i></div>
  <div class="loadtxt" id="loadtxt">Lade Welt …</div>
</div>

<!-- Hauptmenü -->
<div id="mainmenu" class="screen hidden">
  <div class="menu-top">
    <div class="player-chip" id="mmPlayer"></div>
    <div class="cur-row" id="mmCur"></div>
  </div>
  <div class="logo small"><span class="l1">BUILD YOUR OWN</span><span class="l2">TOWER DEFENSE</span></div>
  <div class="menu-buttons">
    <button class="btn big play" data-act="play">▶ PLAY</button>
    <div class="menu-grid">
      <button class="btn" data-act="inventory">🎒 INVENTORY</button>
      <button class="btn" data-act="towers">🏰 TOWERS</button>
      <button class="btn" data-act="shop">🛒 SHOP</button>
      <button class="btn" data-act="quests">📜 QUESTS</button>
      <button class="btn" data-act="settings">⚙️ SETTINGS</button>
      <button class="btn" data-act="collection">📖 COLLECTION</button>
      <button class="btn" data-act="achievements">🏆 ACHIEVEMENTS</button>
      <button class="btn" data-act="share">🔗 GRUNDSTÜCK TEILEN</button>
    </div>
  </div>
  <button class="daily-btn" id="dailyBtn">🎁 Tagesbelohnung</button>
  <div class="menu-foot">v1.0 · Fortschritt wird automatisch gespeichert</div>
</div>

<!-- Spiel-HUD -->
<div id="hud" class="hidden">
  <div class="hud-tl">
    <div class="player-chip" id="hudPlayer"></div>
  </div>
  <div class="hud-tc">
    <div class="wave-panel" id="wavePanel">
      <div class="wp-row"><b id="wpWave">Welle 0</b><span id="wpMode"></span></div>
      <div class="wp-bar"><i id="wpFill"></i></div>
      <div class="wp-row small"><span id="wpEnemies">Gegner: 0 / 0</span><span id="wpNext"></span></div>
    </div>
    <div class="boss-bar hidden" id="bossBar"><div class="bb-name" id="bbName"></div><div class="bb-track"><i id="bbFill"></i><i id="bbShield"></i></div></div>
  </div>
  <div class="hud-tr">
    <div class="res lives" title="Leben"><span>❤️</span><b id="resLives">20</b></div>
    <div class="res coins" title="Münzen"><span>🪙</span><b id="resCoins">0</b></div>
    <div class="res gems" title="Edelsteine"><span>💎</span><b id="resGems">0</b></div>
    <button class="btn small shopbtn" data-act="shop">🛒</button>
  </div>
  <div class="side-menu">
    <button class="sbtn" data-act="pause" title="Menü">☰</button>
    <button class="sbtn" data-act="settings" title="Einstellungen">⚙️</button>
    <button class="sbtn" data-act="inventory" title="Inventar">🎒</button>
    <button class="sbtn" data-act="quests" title="Aufgaben">📜<i class="dot hidden" id="questDot"></i></button>
    <button class="sbtn" data-act="stats" title="Statistiken">📊</button>
    <button class="sbtn" data-act="achievements" title="Erfolge">🏆</button>
  </div>
  <div class="cam-ctl">
    <button class="cbtn" data-cam="rl">⟲</button><button class="cbtn" data-cam="rr">⟳</button>
    <button class="cbtn" data-cam="zi">＋</button><button class="cbtn" data-cam="zo">－</button>
    <button class="cbtn" data-cam="reset" id="camMode">👁 Übersicht</button>
  </div>
  <div class="wave-ctl">
    <button class="btn wavebtn" id="waveBtn">▶ WELLE STARTEN</button>
    <div class="wc-row"><button class="btn small" id="speedBtn">1x</button><button class="btn small" id="pauseBtn">❚❚</button></div>
  </div>
  <div class="joy" id="joy"><div class="joy-knob" id="joyKnob"></div></div>
  <button class="jump-btn" id="jumpBtn">⤒<small>Springen</small></button>
  <button class="build-toggle btn gold" id="buildToggle">🔨 BAUEN</button>
  <div class="build-bar" id="buildBar">
    <div class="bb-tabs" id="bbTabs">
      <button data-bbclose="1" class="bb-close" title="Baumenü schließen (B)">✕</button>
      <button data-tab="towers" class="on">🏰 Türme</button>
      <button data-tab="roads">🛣️ Straßen</button>
      <button data-tab="traps">🪤 Fallen</button>
      <button data-tab="decos">🌳 Deko</button>
      <button data-tab="tools">🧰 Werkzeuge</button>
    </div>
    <div class="bb-items" id="bbItems"></div>
  </div>
  <div class="build-hint hidden" id="buildHint"></div>
  <div class="tower-panel hidden" id="towerPanel"></div>
</div>

<div id="tut" class="hidden"></div>
<div id="toasts"></div>
<div id="banner" class="hidden"></div>
<div id="modal" class="hidden"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle"></h2><button class="xbtn" id="modalClose">✕</button></div><div class="modal-body" id="modalBody"></div></div></div>
</div>

'use strict';
// ============================================================
//  Immer Querformat: hält man das Gerät hochkant, wird das
//  ganze Spiel um 90° gedreht – ohne Hinweis-Meldung.
// ============================================================
const View = (() => {
  let w = innerWidth, h = innerHeight, portrait = false;
  const listeners = [];
  function layout() {
    const W = window.innerWidth, H = window.innerHeight;
    portrait = H > W;
    w = portrait ? H : W; h = portrait ? W : H;   // logische (Querformat-)Größe
    const root = document.getElementById('root');
    if (root) { root.style.width = w + 'px'; root.style.height = h + 'px'; }
    document.body.classList.toggle('portrait', portrait);
    listeners.forEach(f => f());
  }
  // Bildschirmkoordinaten -> Spielkoordinaten (berücksichtigt die Drehung)
  function toLocal(cx, cy) { return portrait ? { x: cy, y: window.innerWidth - cx } : { x: cx, y: cy }; }
  // Auf Android: Vollbild + Querformat sperren (wo der Browser es erlaubt)
  let tried = false;
  function tryLock() {
    if (tried || !matchMedia('(pointer:coarse)').matches) return; tried = true;
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    try {
      const p = req && req.call(el, { navigationUI: 'hide' });
      if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
    } catch (e) {}
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 150));
  window.addEventListener('pointerdown', tryLock, { once: false, passive: true });
  return { layout, toLocal, onChange: f => listeners.push(f), get w() { return w; }, get h() { return h; }, get portrait() { return portrait; } };
})();

// ============================================================

const Audio2 = (() => {
  let ctx = null, master, sfxGain, musicGain, noiseBuf;
  let sfxVol = 0.7, musicVol = 0.45;
  let mood = 'menu', step = 0, nextTime = 0, timer = null;
  const lastPlay = {};

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 1; master.connect(ctx.destination);
    sfxGain = ctx.createGain(); sfxGain.gain.value = sfxVol; sfxGain.connect(master);
    musicGain = ctx.createGain(); musicGain.gain.value = musicVol * 0.5; musicGain.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextTime = ctx.currentTime + 0.1;
    timer = setInterval(schedule, 50);
  }

  function setVolumes(s, m) {
    sfxVol = s; musicVol = m;
    if (sfxGain) sfxGain.gain.value = s;
    if (musicGain) musicGain.gain.value = m * 0.5;
  }

  function tone(freq, dur, type = 'sine', vol = 0.3, slide = 0, when = 0, dest = sfxGain) {
    if (!ctx) return;
    const t = ctx.currentTime + when;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.3, filterFreq = 1200, type = 'lowpass', when = 0, dest = sfxGain, sweep = 0) {
    if (!ctx) return;
    const t = ctx.currentTime + when;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(filterFreq, t);
    if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(40, filterFreq * sweep), t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }

  };
  function play(name) { if (!ctx || sfxVol <= 0) return; const f = SFX[name]; if (f) f(); }

  // ---------------- Musik-Sequenzer ----------------
  const N = n => 440 * Math.pow(2, (n - 69) / 12);
  const SONGS = {
    menu:    { bpm: 96,  chords: [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]], lead: [72, 74, 76, 79, 76, 74, 72, 67], drums: false, pad: 'triangle' },
    build:   { bpm: 84,  chords: [[62, 66, 69], [59, 62, 66], [55, 59, 62], [57, 61, 64]], lead: [74, 0, 78, 76, 0, 74, 71, 0], drums: false, pad: 'sine' },
    wave:    { bpm: 132, chords: [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 55, 59]], lead: [69, 72, 76, 72, 74, 72, 69, 67], drums: true, pad: 'sawtooth' },
    boss:    { bpm: 150, chords: [[52, 55, 59], [53, 56, 60], [50, 53, 57], [51, 55, 58]], lead: [64, 67, 70, 67, 65, 64, 62, 63], drums: true, heavy: true, pad: 'sawtooth' },
    victory: { bpm: 120, chords: [[60, 64, 67], [65, 69, 72], [67, 71, 74], [60, 64, 67]], lead: [72, 76, 79, 84, 79, 76, 79, 84], drums: true, pad: 'square' },
  };
  function setMood(m) { if (mood !== m) { mood = m; step = 0; } }
  function schedule() {
    if (!ctx || musicVol <= 0.001) { if (ctx) nextTime = ctx.currentTime + 0.1; return; }
    const song = SONGS[mood] || SONGS.menu;
    const stepDur = 60 / song.bpm / 2; // Achtel
    while (nextTime < ctx.currentTime + 0.2) {
      const when = nextTime - ctx.currentTime;
      const bar = Math.floor(step / 8) % song.chords.length;
      const chord = song.chords[bar];
      const s8 = step % 8;
      if (s8 === 0) chord.forEach(n => tone(N(n), stepDur * 7.5, song.pad, 0.035, 0, when, musicGain));
      if (s8 % 2 === 0) tone(N(chord[0] - 12), stepDur * 1.6, 'triangle', 0.09, 0, when, musicGain);
      const ln = song.lead[step % song.lead.length];
      if (ln && (step % 16 < 8 || mood !== 'build')) tone(N(ln), stepDur * 0.9, 'square', 0.025, 0, when, musicGain);
      if (song.drums) {
        if (s8 % 4 === 0) { tone(110, 0.12, 'sine', 0.22, 0.4, when, musicGain); }
        if (s8 % 4 === 2) noise(0.08, 0.08, 3000, 'highpass', when, musicGain);
        if (song.heavy && s8 % 2 === 1) noise(0.03, 0.05, 6000, 'highpass', when, musicGain);
      } else if (s8 === 4) {
        noise(0.05, 0.02, 6000, 'highpass', when, musicGain);
      }
      nextTime += stepDur; step++;
    }
  }
  return { init, play, setMood, setVolumes, get ready() { return !!ctx; } };
})();

'use strict';
// ============================================================
//  Prozedurale 3D-Modelle (Türme, Gegner, Deko, Burg)
// ============================================================
const Models = (() => {
  const matCache = new Map();
  function M(color, opt = {}) {
    const key = color + '|' + (opt.e || '') + '|' + (opt.o ?? 1) + '|' + (opt.ei ?? 1) + '|' + (opt.side || 0);
    let m = matCache.get(key);
    if (!m) {
      m = new THREE.MeshLambertMaterial({ color });
      if (opt.e) { m.emissive = new THREE.Color(opt.e); m.emissiveIntensity = opt.ei ?? 1; }
      if (opt.o !== undefined && opt.o < 1) { m.transparent = true; m.opacity = opt.o; m.depthWrite = false; }
      if (opt.side) m.side = THREE.DoubleSide;
      matCache.set(key, m);
    }
    return m;
  }
  const G = {}; // geometry cache
  function geo(key, fn) { return G[key] || (G[key] = fn()); }
  const box = (w, h, d) => geo(`b${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d));
  const cyl = (rt, rb, h, s = 12) => geo(`c${rt},${rb},${h},${s}`, () => new THREE.CylinderGeometry(rt, rb, h, s));
  const sph = (r, s = 12) => geo(`s${r},${s}`, () => new THREE.SphereGeometry(r, s, Math.max(6, s * 0.75 | 0)));
  const cone = (r, h, s = 10) => geo(`k${r},${h},${s}`, () => new THREE.ConeGeometry(r, h, s));
  const tor = (r, t, s = 8, ts = 20, arc = Math.PI * 2) => geo(`t${r},${t},${s},${ts},${arc}`, () => new THREE.TorusGeometry(r, t, s, ts, arc));
  const oct = (r) => geo(`o${r}`, () => new THREE.OctahedronGeometry(r, 0));
  const ico = (r, d = 0) => geo(`i${r},${d}`, () => new THREE.IcosahedronGeometry(r, d));
  const dod = (r) => geo(`d${r}`, () => new THREE.DodecahedronGeometry(r, 0));

  function mesh(g, m, x = 0, y = 0, z = 0, parent, shadow = true) {
    const o = new THREE.Mesh(g, m);
    o.position.set(x, y, z);
    if (shadow) { o.castShadow = true; o.receiveShadow = true; }
    if (parent) parent.add(o);
    return o;
  }

  // ---------------------------------------------------------
  //  TÜRME
  // ---------------------------------------------------------
  function towerBody(style, g, t) {
    const c1 = t.c1, c2 = t.c2;
    switch (style) {
      case 'stone': {
        mesh(cyl(0.34, 0.4, 0.55, 10), M(c1), 0, 0.42, 0, g);
        for (let i = 0; i < 5; i++) {
          const a = i / 5 * Math.PI * 2;
          mesh(box(0.13, 0.12, 0.13), M(c1), Math.cos(a) * 0.3, 0.75, Math.sin(a) * 0.3, g);
        }
        mesh(box(0.12, 0.18, 0.04), M('#2a2a2a'), 0, 0.42, 0.37, g);
        mesh(cyl(0.41, 0.41, 0.06, 10), M(c2), 0, 0.2, 0, g);
        return 0.72;
      }
      case 'wood': {
        for (const [x, z] of [[-0.25, -0.25], [0.25, -0.25], [-0.25, 0.25], [0.25, 0.25]])
          mesh(box(0.08, 0.6, 0.08), M(c2), x, 0.45, z, g);
        mesh(box(0.62, 0.08, 0.62), M(c1), 0, 0.77, 0, g);
        mesh(box(0.56, 0.04, 0.04), M(c2), 0, 0.45, 0.25, g).rotation.z = 0.5;
        mesh(box(0.04, 0.04, 0.56), M(c2), 0.25, 0.45, 0, g).rotation.x = 0.5;
        return 0.8;
      }
      case 'metal': {
        mesh(cyl(0.3, 0.38, 0.5, 8), M(c1), 0, 0.4, 0, g);
        mesh(cyl(0.31, 0.31, 0.06, 8), M(t.c3, { e: t.c3, ei: 0.6 }), 0, 0.5, 0, g);
        mesh(cyl(0.36, 0.36, 0.08, 8), M(c2), 0, 0.66, 0, g);
        return 0.7;
      }
      case 'ice': {
        mesh(cyl(0.22, 0.38, 0.6, 7), M(c1, { e: '#3a90c0', ei: 0.25 }), 0, 0.45, 0, g);
        for (let i = 0; i < 4; i++) {

          sp.rotation.z = Math.cos(a) * -0.4; sp.rotation.x = Math.sin(a) * 0.4;

        return 0.75;

      case 'arcane': {

  function makeTower(def, rarityColor) {
    const g = new THREE.Group();
    g.userData.spinners = [];
    // Sockel
    mesh(cyl(0.46, 0.5, 0.16, 6), M('#8c8577'), 0, 0.08, 0, g);
    const trim = mesh(cyl(0.47, 0.47, 0.04, 6), M(rarityColor, { e: rarityColor, ei: 0.35 }), 0, 0.17, 0, g);
    trim.receiveShadow = false;
    const body = new THREE.Group(); g.add(body);
    body.userData.spinners = g.userData.spinners;
    const top = towerBody(def.body, body, def);
    const head = new THREE.Group(); head.position.y = top; body.add(head);
    const ud = {};
    head.userData.spinners = g.userData.spinners;
    head.parent.userData.spinners = g.userData.spinners;
    towerHead(def.head, head, def, ud);
    const lvl = new THREE.Group(); g.add(lvl);
    Object.assign(g.userData, ud, { head, body, lvlGroup: lvl, topY: top, def });
    return g;
  }

  // Visuelle Upgrade-Stufen
  function applyTowerLevel(g, level) {
    const ud = g.userData, def = ud.def, lv = ud.lvlGroup;
    while (lv.children.length) lv.remove(lv.children[0]);
    const s = 1 + (level - 1) * 0.07;
    ud.body.scale.set(s, s + (level - 1) * 0.05, s);
    const topY = ud.topY * ud.body.scale.y;
    if (level >= 2) {
      const band = mesh(cyl(0.42, 0.42, 0.05, 6), M('#d0d4dc'), 0, 0.26, 0, lv); band.receiveShadow = false;
      for (let i = 0; i < level - 1; i++) mesh(box(0.06, 0.06, 0.02), M('#ffd84a', { e: '#ffaa00', ei: 0.6 }), -0.12 + i * 0.08, 0.3, 0.44, lv, false);
    }
    if (level >= 3) {
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * Math.PI * 2 + Math.PI / 6;
        mesh(cone(0.05, 0.2, 5), M('#b8bcc6'), Math.cos(a) * 0.45, 0.28, Math.sin(a) * 0.45, lv);
      }
    }
    if (level >= 4) {
      const r = mesh(tor(0.52, 0.03, 6, 30), M(def.c3, { e: def.c3, ei: 1 }), 0, topY * 0.55, 0, lv, false);
      r.rotation.x = Math.PI / 2; r.userData.spin = 1.4; r.userData.lvSpin = true;
    }
    if (level >= 5) {
      const crown = new THREE.Group(); crown.position.y = topY + 0.62; lv.add(crown);
      mesh(cyl(0.13, 0.13, 0.06, 10), M('#ffd700', { e: '#ffb000', ei: 0.6 }), 0, 0, 0, crown, false);
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * Math.PI * 2;
        mesh(cone(0.035, 0.12, 4), M('#ffd700', { e: '#ffb000', ei: 0.6 }), Math.cos(a) * 0.11, 0.08, Math.sin(a) * 0.11, crown, false);
      }
      mesh(sph(0.04), M('#ff2a6a', { e: '#ff2a6a', ei: 1 }), 0, 0.06, 0, crown, false);
      crown.userData.float = true; ud.crown = crown;
      const aura = mesh(cyl(0.6, 0.6, 0.02, 24), M(def.c3, { e: def.c3, ei: 1, o: 0.35 }), 0, 0.05, 0, lv, false);
      aura.userData.pulse = true; ud.aura = aura;
    } else { ud.crown = null; ud.aura = null; }
  }

  // ---------- Texturen ----------
  function canvasTex(key, fn, size = 128) {
    if (texCache[key]) return texCache[key];
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'); fn(g, size);

  function roadTex(pattern) {

      if (pattern === 'cobble') {
        const n = 5, cs = s / n;
        for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
          const ox = (y % 2) * cs / 2;
          const l = 70 + rnd() * 25;

          roundRect(g, x * cs + ox + 2, y * cs + 2, cs - 4, cs - 4, 6); g.fill();
          if (ox) { roundRect(g, -cs / 2 + 2, y * cs + 2, cs - 4, cs - 4, 6); g.fill(); }
        }
      } else if (pattern === 'sand') {
        for (let i = 0; i < 900; i++) { g.fillStyle = `hsla(40,40%,${60 + rnd() * 35}%,0.6)`; g.fillRect(rnd() * s, rnd() * s, 2, 2); }
      } else if (pattern === 'grass') {
        for (let i = 0; i < 500; i++) { g.strokeStyle = `hsla(100,45%,${55 + rnd() * 35}%,0.8)`; const x = rnd() * s, y = rnd() * s; g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd() * 3 - 1.5, y - 4 - rnd() * 4); g.stroke(); }
      } else if (pattern === 'asphalt') {
        g.fillStyle = '#d8d8d8'; g.fillRect(0, 0, s, s);
        for (let i = 0; i < 1500; i++) { g.fillStyle = `hsla(0,0%,${70 + rnd() * 30}%,0.7)`; g.fillRect(rnd() * s, rnd() * s, 1.5, 1.5); }
      }
    });
  }
  function grassTex() {
    return canvasTex('grass_' + biome.id, (g, s) => {

  // ---------- Setup ----------

  // ---------- Landschaft ----------
  function buildEnvironment(b, playerName) {

    while (envGroup.children.length) envGroup.remove(envGroup.children[0]);

    scene.fog = new THREE.Fog(b.fog, 45, 120);

    }
    // Zaun um das Grundstück (mit Lücken bei Spawn und Ziel)
    const sp = tileToWorld(SPAWN.x, SPAWN.z), gl = tileToWorld(GOAL.x, GOAL.z);
    for (let x = -GW / 2; x <= GW / 2; x += 1) for (const z of [-GH / 2 - 0.3, GH / 2 + 0.3]) Models.mesh(Models.box(0.08, 0.35, 0.08), Models.M('#a8784a'), x, 0.17, z, plotGroup);

    // Infotafel

    info.position.set(sp.x - 1.0, 1.9, sp.z); plotGroup.add(info);
    const info2 = textSprite('Ziel 🏁', 'rgba(30,120,60,0.85)', '#fff', 320, 110); info2.scale.set(2, 0.7, 1);
    info2.position.set(gl.x + 1.4, 2.6, gl.z); plotGroup.add(info2);

    // Wasser (oder Lava)
    waterMat = new THREE.ShaderMaterial({
      transparent: true,
      uniforms: { t: { value: 0 }, c: { value: new THREE.Color(b.water) }, lava: { value: b.lava ? 1 : 0 } },
      vertexShader: `uniform float t; varying vec2 vUv; varying float vH;
        void main(){ vUv=uv; vec3 p=position; float h=sin(p.x*1.3+t*1.6)*0.06+cos(p.y*1.1+t*1.2)*0.06; p.z+=h; vH=h;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);} `,
      fragmentShader: `uniform float t; uniform vec3 c; uniform float lava; varying vec2 vUv; varying float vH;
        void main(){ float s=sin(vUv.x*40.0+t*2.0)*sin(vUv.y*36.0-t*1.5);

      const w = new THREE.Mesh(wg, waterMat); w.rotation.x = -Math.PI / 2; w.position.set(x, 0.04, z); envGroup.add(w);
      for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2; Models.mesh(Models.dod(0.4 + rnd() * 0.3), Models.M('#8a8a86'), x + Math.cos(a) * r * 0.82, 0.05, z + Math.sin(a) * r * 0.82, envGroup); }

    const inPond = (x, z) => [[-20, 12, 6.5], [22, -13, 5.5], [-8, -16, 4.5], [16, 15, 5]].some(([px, pz, r]) => Math.hypot(x - px, z - pz) < r);
    const inNeighbor = (x, z) => Math.abs(x) < 9 && (Math.abs(z - 22) < 6 || Math.abs(z + 22) < 6) ;
    const place = (n, fn, minR = 0, maxR = 45) => {
      let placed = 0, tries = 0;
      while (placed < n && tries++ < n * 20) {
        const x = (rnd() - 0.5) * 2 * maxR, z = (rnd() - 0.5) * 2 * maxR;

        if (Math.abs(z - sp.z) < 1.6 && x < -GW / 2 && x > -GW / 2 - 4) continue;
        if (Math.abs(z - gl.z) < 1.6 && x > GW / 2 && x < GW / 2 + 4) continue;

      }
    };
    place(70, () => Models.makeTree(b.tree, b.leaf, 0.9 + rnd() * 0.8));
    place(40, () => Models.makeDeco('bush', b));
    place(30, () => Models.makeDeco('rock', b));
    place(40, () => Models.makeDeco('flowers', b));
    place(6, () => { const h = Models.makeDeco('house', b); h.scale.setScalar(1.6); return h; }, 18, 34);
    // Laternen und Zäune an den Rändern
    for (let x = -GW / 2; x <= GW / 2; x += 5.5) for (const z of [-GH / 2 - 0.9, GH / 2 + 0.9]) { const l = Models.makeDeco('lantern', b); l.position.set(x, 0, z); envGroup.add(l); }

      if (b.snowcap || b.id === 'snow' || b.id === 'iceworld') Models.mesh(Models.cone(3.2, h * 0.3, 7), Models.M('#ffffff'), Math.cos(a) * r, h - h * 0.15 - 1, Math.sin(a) * r, envGroup, false);

  function buildNeighbors(b) {
    const rnd = mulberry(99);
    [[0, -22, NEIGHBOR_NAMES[0]], [0, 22, NEIGHBOR_NAMES[1]]].forEach(([cx, cz, name], idx) => {
      const g = new THREE.Group(); g.position.set(cx, 0, cz);
      const p = Models.mesh(Models.box(16, 0.3, 9), Models.M(b.plot), 0, -0.15, 0, g); p.receiveShadow = true;
      for (let x = -7; x <= 7; x++) Models.mesh(Models.box(0.96, 0.05, 0.9), Models.M('#9b9a94'), x, 0.02, idx ? 1 : -1, g, false);
      for (let i = 0; i < 6; i++) {
        const def = TOWERS[(i * 5 + idx * 3) % 20];
        const t = Models.makeTower(def, RARITIES[def.rarity].color);
        Models.applyTowerLevel(t, 1 + ((i + idx) % 5));
        t.position.set(-6 + i * 2.4, 0, (idx ? 1 : -1) + (i % 2 ? 1.6 : -1.6)); g.add(t);
      }
      const sign = textSprite('👤 ' + name, 'rgba(60,60,80,0.85)'); sign.position.set(0, 1.4, idx ? 5.4 : -5.4); g.add(sign);
      const castle = Models.makeCastle(CASTLES[(idx + 1) % CASTLES.length]); castle.position.set(8.6, 0, idx ? 1 : -1); g.add(castle);
      neighborGroup.add(g);

  }

  // ---------- Straßen ----------
  function roadMaterial(def, skin, x, z) {
    let color = def.color;
    let emissive = null;
    if (skin && skin.tint) {
      if (skin.tint === 'rainbow') color = new THREE.Color().setHSL(((x * 0.07 + z * 0.05) % 1 + 1) % 1, 0.75, 0.6).getStyle();
      else { color = new THREE.Color(def.color).lerp(new THREE.Color(skin.tint), 0.75).getStyle(); }
      if (skin.emissive) emissive = skin.tint;
    }
    const key = 'rm_' + def.id + '_' + color + '_' + emissive;
    if (!texCache[key]) {
      const m = new THREE.MeshLambertMaterial({ color, map: roadTex(def.pattern) });
      if (emissive) { m.emissive = new THREE.Color(emissive); m.emissiveIntensity = 0.35; }
      texCache[key] = m;
    }
    return texCache[key];
  }
  function rebuildRoads(grid, skin) {
    for (const g of roadMeshes.values()) roadGroup.remove(g);
    roadMeshes.clear();
    for (let x = 0; x < GW; x++) for (let z = 0; z < GH; z++) {
      const c = grid[x][z];
      if (c && c.type === 'road') addRoadMesh(grid, x, z, skin);
    }
  }
  function isRoadAt(grid, x, z) {
    if (x === SPAWN.x - 1 && z === SPAWN.z) return true;
    if (x === GOAL.x + 1 && z === GOAL.z) return true;
    return x >= 0 && z >= 0 && x < GW && z < GH && grid[x][z] && grid[x][z].type === 'road';
  }
  function addRoadMesh(grid, x, z, skin) {
    const c = grid[x][z]; const def = ROAD_BY_ID[c.road] || ROADS[0];
    const g = new THREE.Group(); const p = tileToWorld(x, z); g.position.copy(p);
    const mat = roadMaterial(def, skin, x, z);
    const edgeMat = Models.M(def.edge);
    const w = def.width, hgt = 0.05;
    const n = [isRoadAt(grid, x, z - 1), isRoadAt(grid, x + 1, z), isRoadAt(grid, x, z + 1), isRoadAt(grid, x - 1, z)]; // N E S W
    const mk = (sx, sz, px, pz) => { const m = new THREE.Mesh(Models.box(sx, hgt, sz), mat); m.position.set(px, hgt / 2 + 0.005, pz); m.receiveShadow = true; g.add(m); return m; };
    mk(w, w, 0, 0);
    const arm = (1 - w) / 2;
    if (arm > 0.001) {
      if (n[0]) mk(w, arm, 0, -w / 2 - arm / 2);
      if (n[2]) mk(w, arm, 0, w / 2 + arm / 2);
      if (n[1]) mk(arm, w, w / 2 + arm / 2, 0);
      if (n[3]) mk(arm, w, -w / 2 - arm / 2, 0);
    }
    // Bordsteine an offenen Seiten
    const cw = 0.06, ch = 0.09;
    const curb = (sx, sz, px, pz) => { const m = new THREE.Mesh(Models.box(sx, ch, sz), edgeMat); m.position.set(px, ch / 2, pz); m.castShadow = false; m.receiveShadow = true; g.add(m); };
    const hw = w / 2;
    if (!n[0]) curb(w + cw, cw, 0, -hw);
    if (!n[2]) curb(w + cw, cw, 0, hw);
    if (!n[1]) curb(cw, w + cw, hw, 0);
    if (!n[3]) curb(cw, w + cw, -hw, 0);
    if (arm > 0.001) { // Bordsteine entlang der Arme
      if (n[0]) { curb(cw, arm, -hw, -hw - arm / 2); curb(cw, arm, hw, -hw - arm / 2); }
      if (n[2]) { curb(cw, arm, -hw, hw + arm / 2); curb(cw, arm, hw, hw + arm / 2); }
      if (n[1]) { curb(arm, cw, hw + arm / 2, -hw); curb(arm, cw, hw + arm / 2, hw); }
      if (n[3]) { curb(arm, cw, -hw - arm / 2, -hw); curb(arm, cw, -hw - arm / 2, hw); }
    }
    // Mittellinie für Asphalt
    if (def.pattern === 'asphalt') {
      const lm = Models.M(def.edge === '#e8e8e8' ? '#ffffff' : def.edge);
      const dirs = [[0, -1], [1, 0], [0, 1], [-1, 0]];
      dirs.forEach(([dx, dz], i) => { if (!n[i]) return; const m = new THREE.Mesh(Models.box(dx ? 0.3 : 0.05, 0.01, dz ? 0.3 : 0.05), lm); m.position.set(dx * 0.3, hgt + 0.01, dz * 0.3); g.add(m); });
    }
    roadGroup.add(g); roadMeshes.set(x + ',' + z, g);
    return g;
  }

  // ---------- Wegfindung (A*) ----------
  function findPath(grid, blocked) {
    const key = (x, z) => x * 100 + z;
    const walk = (x, z) => x >= 0 && z >= 0 && x < GW && z < GH && grid[x][z] && grid[x][z].type === 'road' && !(blocked && blocked.x === x && blocked.z === z);
    if (!walk(SPAWN.x, SPAWN.z) || !walk(GOAL.x, GOAL.z)) return null;
    const open = [{ x: SPAWN.x, z: SPAWN.z, g: 0, f: 0 }];
    const came = new Map(), gs = new Map([[key(SPAWN.x, SPAWN.z), 0]]);
    const h = (x, z) => Math.abs(x - GOAL.x) + Math.abs(z - GOAL.z);
    while (open.length) {
      let bi = 0; for (let i = 1; i < open.length; i++) if (open[i].f < open[bi].f) bi = i;
      const cur = open.splice(bi, 1)[0];
      if (cur.x === GOAL.x && cur.z === GOAL.z) {
        const path = [[cur.x, cur.z]]; let k = key(cur.x, cur.z);
        while (came.has(k)) { const p = came.get(k); path.push(p); k = key(p[0], p[1]); }
        return path.reverse();
      }
      for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cur.x + dx, nz = cur.z + dz;
        if (!walk(nx, nz)) continue;
        const ng = cur.g + 1, nk = key(nx, nz);
        if (ng < (gs.get(nk) ?? Infinity)) {
          gs.set(nk, ng); came.set(nk, [cur.x, cur.z]);
          const ex = open.find(o => o.x === nx && o.z === nz);
          if (ex) { ex.g = ng; ex.f = ng + h(nx, nz); } else open.push({ x: nx, z: nz, g: ng, f: ng + h(nx, nz) });
        }
      }
    }
    return null;
  }

  // Aus Feldpfad eine geglättete Laufbahn (Kurven abgerundet)
  function buildRoute(tilePath) {
    const pts = [World.portalPos.clone()];
    for (const [x, z] of tilePath) pts.push(tileToWorld(x, z));
    pts.push(World.castlePos.clone());
    const out = [pts[0].clone()];
    const R = 0.42;
    for (let i = 1; i < pts.length - 1; i++) {
      const a = pts[i - 1], b = pts[i], c = pts[i + 1];

'use strict';
// ============================================================
//  Spielfigur: laufen & springen wie in Roblox (WASD / Joystick)
// ============================================================
const Player = (() => {
  const V3 = THREE.Vector3;
  const SCALE = 0.55, SPEED = 5.2, JUMP = 8.5, GRAV = 26;
  let mesh = null, tag = null, scene = null;
  const pos = new V3(), vel = new V3();
  let yaw = 0, onGround = true, walkT = 0, active = false, jumpQueued = false;
  const joy = { x: 0, y: 0 };          // vom Touch-Joystick (-1..1)
  let obstacles = () => [];

  function spawn(sc, name, shirt, pants) {
    remove();
    scene = sc;
    mesh = Models.makeAvatar(shirt, pants);
    mesh.scale.setScalar(SCALE);
    tag = World.textSprite(name, 'rgba(0,0,0,0.45)', '#fff', 384, 96);
    tag.scale.set(4 / SCALE * 0.42, 1 / SCALE * 0.42, 1); tag.position.y = 3.15;
    mesh.add(tag);
    pos.set(-1.5, 0, GH / 2 + 1.6); vel.set(0, 0, 0); yaw = Math.PI;
    mesh.position.copy(pos);
    scene.add(mesh);
    active = true;
  }
  function remove() { if (mesh && scene) scene.remove(mesh); mesh = null; active = false; }
  function setObstacles(fn) { obstacles = fn; }
  function jump() { jumpQueued = true; }

  function update(dt, keys, camYaw) {
    if (!active || !mesh) return;
    // Eingabe: vorwärts/rechts relativ zur Kamera
    let fwd = 0, right = 0;
    if (keys.has('w') || keys.has('arrowup')) fwd += 1;
    if (keys.has('s') || keys.has('arrowdown')) fwd -= 1;
    if (keys.has('d') || keys.has('arrowright')) right += 1;
    if (keys.has('a') || keys.has('arrowleft')) right -= 1;
    fwd += -joy.y; right += joy.x;
    const len = Math.hypot(fwd, right);
    if (len > 1) { fwd /= len; right /= len; }
    const run = keys.has('shift') ? 1.35 : 1;
    const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);   // Blickrichtung der Kamera
    const rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
    const mx = (fx * fwd + rx * right) * SPEED * run, mz = (fz * fwd + rz * right) * SPEED * run;
    const moving = Math.hypot(mx, mz) > 0.1;
    // weich beschleunigen
    const k = Math.min(1, dt * (onGround ? 14 : 5));
    vel.x += (mx - vel.x) * k; vel.z += (mz - vel.z) * k;
    if ((jumpQueued || keys.has(' ')) && onGround) { vel.y = JUMP; onGround = false; Audio2.play('click'); }
    jumpQueued = false;
    vel.y -= GRAV * dt;
    pos.addScaledVector(vel, dt);
    if (pos.y <= 0) { pos.y = 0; vel.y = 0; onGround = true; }
    // Kollision mit Türmen, Deko, Burg (Kreise)
    for (const o of obstacles()) {
      if (pos.y > (o.h || 1.2)) continue;
      const dx = pos.x - o.x, dz = pos.z - o.z, d = Math.hypot(dx, dz), r = o.r + 0.25;
      if (d < r && d > 0.0001) { pos.x = o.x + dx / d * r; pos.z = o.z + dz / d * r; }

    // Drehen in Laufrichtung
    if (moving) {
      const target = Math.atan2(mx, mz);
      let d = target - yaw; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
      yaw += d * Math.min(1, dt * 14);
    }
    // Animation
    const sp = Math.hypot(vel.x, vel.z);
    walkT += dt * sp * 2.2;
    const A = mesh.userData.A;
    const sw = onGround ? Math.sin(walkT) * Math.min(1, sp / SPEED) * 0.9 : 0;
    A.legs[0].rotation.x = sw; A.legs[1].rotation.x = -sw;
    if (onGround) { A.arms[0].rotation.x = -sw; A.arms[1].rotation.x = sw; A.arms[0].rotation.z = A.arms[1].rotation.z = 0; }
    else { A.arms[0].rotation.x = A.arms[1].rotation.x = -2.6; A.legs[0].rotation.x = 0.4; A.legs[1].rotation.x = -0.2; }
    mesh.position.copy(pos);
    mesh.position.y += onGround && sp > 0.5 ? Math.abs(Math.sin(walkT)) * 0.04 : 0;
    mesh.rotation.y = yaw;
    if (onGround && sp > 3 && Math.random() < dt * 8) Particles.emit(pos.x, 0.05, pos.z, 1, '#cfc3a0', { speed: 0.3, up: 0.4, life: 0.4, size: 0.18, tint: false });
  }
  return { spawn, remove, update, jump, setObstacles, joy, get pos() { return pos; }, get active() { return active; } };
})();

      if (c.type === 'tower') return { ok: false, why: 'Türme bitte antippen und AUFHEBEN' };
      if (c.type === 'road' && traps.has(x + ',' + z)) return { ok: true };
      if (c.type === 'road') {
        if (isFixed) return { ok: false, why: 'Start- und Zielfeld sind fest' };
        if (R && R.phase === 'wave') return { ok: false, why: 'Wege nur in der Pause zwischen den Wellen ändern' };
        if (!World.findPath(grid, { x, z })) return { ok: false, why: 'Kein Weg mehr zum Ziel – nicht erlaubt!' };
      }
      return { ok: true };
    }
    if (c) return { ok: false, why: c.type === 'road' ? 'Nicht auf die Straße bauen' : 'Feld ist belegt' };
    if (sel.kind === 'tower') {

      return { ok: true };
    }
    if (sel.kind === 'deco') {
      const d = DECO_BY_ID[sel.id];

      return { ok: true };
    }
    if (sel.kind === 'move') return { ok: true };
    return { ok: false };
  }

  function makeGhost(sel) {
    let g;
    if (sel.kind === 'tower' || sel.kind === 'move') {
      const def = sel.kind === 'move' ? sel.tower.def : TOWER_BY_ID[sel.id];
      g = Models.makeTower(def, rarityColor(def));
    } else if (sel.kind === 'deco') g = Models.makeDeco(sel.id, World.biome);
    else if (sel.kind === 'trap') g = Models.makeTrap(TRAP_BY_ID[sel.id]);
    else {
      g = new THREE.Group();
      Models.mesh(Models.box(0.98, 0.08, 0.98), Models.M('#ffffff'), 0, 0.05, 0, g, false);
      if (sel.kind === 'erase') { const x1 = Models.mesh(Models.box(0.9, 0.1, 0.12), Models.M('#ff3030'), 0, 0.12, 0, g, false); x1.rotation.y = Math.PI / 4; const x2 = x1.clone(); x2.rotation.y = -Math.PI / 4; g.add(x2); }
    }
    g.traverse(o => {
      if (o.isMesh) { o.material = new THREE.MeshBasicMaterial({ color: 0x55ff77, transparent: true, opacity: 0.55, depthWrite: false }); o.castShadow = false; }
    });

  }
  function hover(p) {
    if (!buildSel) { lastHoverTile = null; return; }
    const t = worldToTile(p);
    if (!t || !inPlot(t.x, t.z)) { if (ghost) ghost.visible = false; rangeRing.visible = false; return; }
    lastHoverTile = t;
    const key = buildSel.kind + (buildSel.id || '');
    if (!ghost || ghostKey !== key) { if (ghost) scene.remove(ghost); ghost = makeGhost(buildSel); ghostKey = key; scene.add(ghost); }
    ghost.visible = true;
    ghost.position.copy(tileToWorld(t.x, t.z));
    const ok = canPlace(buildSel, t.x, t.z).ok;
    ghost.traverse(o => { if (o.isMesh) o.material.color.set(ok ? 0x55ff77 : 0xff4040); });
    const def = buildSel.kind === 'tower' ? TOWER_BY_ID[buildSel.id] : buildSel.kind === 'move' ? buildSel.tower.def : null;
    if (def && def.range > 0) showRange(ghost.position, buildSel.kind === 'move' ? towerStats(buildSel.tower).range : def.range, ok ? 0x55ff77 : 0xff4040);
    else rangeRing.visible = false;
  }

  }

  let paintLast = null, painted = 0;

    if (!buildSel || (buildSel.kind !== 'road' && buildSel.kind !== 'erase' && buildSel.kind !== 'trap')) return;
    const t = worldToTile(p); if (!t) return;
    const k = t.x + ',' + t.z; if (k === paintLast) return; paintLast = k;
    if (tryPlace(t.x, t.z, true)) painted++;
  }
  function paintEnd(p, wasTap) {
    if (!buildSel) return;
    if (buildSel.kind === 'road' || buildSel.kind === 'erase' || buildSel.kind === 'trap') { if (painted === 0 && wasTap) { const t = worldToTile(p); if (t) tryPlace(t.x, t.z, false); } }
    else if (wasTap || true) { const t = worldToTile(p); if (t) tryPlace(t.x, t.z, false); }
    paintLast = null;
  }
  function tap(p) {
    if (buildSel) { const t = worldToTile(p); if (t) tryPlace(t.x, t.z, false); return; }
    const t = worldToTile(p);
    if (t && inPlot(t.x, t.z) && grid[t.x][t.z] && grid[t.x][t.z].type === 'tower') { select(grid[t.x][t.z].t); Audio2.play('click'); }
    else select(null);
  }

  function tryPlace(x, z, silent) {
    const sel = buildSel; if (!sel || demo) return false;

    } else if (sel.kind === 'trap') {

    } else if (sel.kind === 'deco') {

      Save.addStat('decoBuilt'); Audio2.play('place'); saveLayout();

    } else if (sel.kind === 'move') {
      const t = sel.tower;

    ui.hud && ui.hud();

  }

  // Bestes freies Feld für einen Turm (meiste Wegfelder in Reichweite) – fürs Tutorial
  function bestSpot(range) {
    if (!route) return null;
    let best = null, bv = -1;
    for (let x = 0; x < GW; x++) for (let z = 0; z < GH; z++) {
      if (grid[x][z]) continue;
      const v = route.tiles.filter(([a, b]) => (a - x) ** 2 + (b - z) ** 2 <= range * range).length;
      if (v > bv) { bv = v; best = { x, z }; }
    }
    return best;
  }

  // ---------------- Inventar / Fallen ----------------
  function available(kind, id) {
    if (kind === 'tower') return (Save.P.towerInv[id] || 0) - towers.filter(t => t.def.id === id).length;
    if (kind === 'trap') { let n = 0; for (const t of traps.values()) if (t.def.id === id) n++; return (Save.P.trapInv[id] || 0) - n; }
    return 0;
  }
  function buyRoadPieces(n) {
    const cost = ROAD_PIECE_PRICE * n;
    if (R.coins < cost) { ui.toast && ui.toast('Nicht genug Münzen', 'bad'); Audio2.play('error'); return false; }
    R.coins -= cost; Save.P.roadPieces += n; Save.saveSoon(); Audio2.play('coin');
    ui.toast && ui.toast(`🛣️ +${n} Wegstück${n > 1 ? 'e' : ''}`, 'good');
    return true;
  }
  function spawnTrap(def, x, z, animate) {
    const m = Models.makeTrap(def); m.position.copy(tileToWorld(x, z)); scene.add(m);
    if (animate) { popIn(m); Particles.emit(m.position.x, 0.2, m.position.z, 16, def.color, { speed: 1.5, life: 0.5 }); }
    traps.set(x + ',' + z, { def, x, z, mesh: m, cd: 0, tick: 0 });
  }
  function removeTrap(x, z) { const t = traps.get(x + ',' + z); if (!t) return; scene.remove(t.mesh); traps.delete(x + ',' + z); snapshotRun(); }
  function updateTraps(dt, time) {
    if (!traps.size) return;
    const scale = Math.max(1, hpScale(Math.max(1, R.wave)) * 0.8);
    for (const tr of traps.values()) {
      const d = tr.def;
      tr.cd = Math.max(0, tr.cd - dt); tr.tick -= dt;
      if (tr.mesh.userData.spin) tr.mesh.userData.spin.rotation.y += dt * 2;
      if (tr.mesh.userData.flame) tr.mesh.userData.flame.scale.y = 1 + Math.sin(time * 15 + tr.x) * 0.25;
      if (tr.mesh.userData.led) tr.mesh.userData.led.visible = tr.cd <= 0 && Math.sin(time * 8) > 0;
      const on = [];
      for (const e of enemies) if (e.alive && !e.fly && Math.abs(e.pos.x - tr.mesh.position.x) < 0.5 && Math.abs(e.pos.z - tr.mesh.position.z) < 0.5) on.push(e);
      if (!on.length) continue;
      if (d.id === 'trap_spike' && tr.tick <= 0) { tr.tick = d.every; for (const e of on) damage(e, d.dmg * scale, 'phys', null); Particles.emit(tr.mesh.position.x, 0.2, tr.mesh.position.z, 4, '#dddddd', { speed: 1, life: 0.3 }); }
      if (d.id === 'trap_glue') for (const e of on) applySlow(e, d.slow, 0.3);
      if (d.id === 'trap_fire') for (const e of on) if (!(e.def.immune && e.def.immune.includes('fire'))) { e.burnDps = Math.max(e.burnT > 0 ? e.burnDps : 0, d.burn * scale); e.burnT = 2.5; }
      if (d.id === 'trap_bomb' && tr.cd <= 0) {
        tr.cd = d.rearm; const p = tr.mesh.position;
        for (const e of enemies) if (e.alive && !e.fly && dist2(e.pos, p) < d.splash * d.splash) damage(e, d.dmg * scale, 'explosive', null);
        Particles.emit(p.x, 0.3, p.z, 30, '#ff8a3a', { speed: 3, up: 2.5, life: 0.5 }); ring(p, d.splash, '#ff8a3a', 0.35); Audio2.play('explosion');
      }
      if (d.id === 'trap_frost' && tr.cd <= 0) { tr.cd = d.rearm; for (const e of on) applyStun(e, d.stun); ring(tr.mesh.position, 0.8, '#bfefff', 0.4); Particles.emit(tr.mesh.position.x, 0.3, tr.mesh.position.z, 20, '#dff8ff', { speed: 2, life: 0.5 }); Audio2.play('shoot_ice'); }
    }
  }

  // ---------------- Türme ----------------
  function spawnTower(def, x, z, rot, animate) {
    const mesh = Models.makeTower(def, rarityColor(def));
    mesh.position.copy(tileToWorld(x, z)); mesh.rotation.y = 0;
    mesh.userData.head.rotation.y = rot * Math.PI / 2;
    Models.applyTowerLevel(mesh, 1);
    scene.add(mesh);
    if (animate) { popIn(mesh); Particles.emit(mesh.position.x, 0.3, mesh.position.z, 24, RARITIES[def.rarity].glow, { speed: 2, up: 2, life: 0.7 }); }
    const t = { def, x, z, rot, level: 1, invested: def.cost, mesh, cd: Math.random() * 0.3, targeting: 'first', kills: 0, dmgDealt: 0, stun: 0,
      buffDmg: 1, buffRate: 1, buffRange: 0, beam: null, beam2: null, drones: [], timer: 0 };
    if (def.type === 'drone') for (let i = 0; i < def.drones; i++) addDrone(t, i);
    grid[x][z] = { type: 'tower', t };
    towers.push(t);
    return t;
  }
  function addDrone(t, i) {
    const d = new THREE.Group();
    Models.mesh(Models.box(0.16, 0.06, 0.16), Models.M('#d0d6de'), 0, 0, 0, d, false);
    for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) Models.mesh(Models.cyl(0.07, 0.07, 0.01, 8), Models.M('#38c6ff', { e: '#38c6ff', ei: 0.6, o: 0.7 }), x * 0.11, 0.04, z * 0.11, d, false);
    Models.mesh(Models.sph(0.03), Models.M('#ff3040', { e: '#ff3040', ei: 1 }), 0, -0.03, 0.08, d, false);
    d.position.copy(t.mesh.position).add(new V3(0, 1.3, 0));
    scene.add(d);
    t.drones.push({ mesh: d, phase: i * Math.PI, cd: 0, target: null });
  }
  function removeTowerMesh(t) {
    scene.remove(t.mesh);
    if (t.beam) scene.remove(t.beam); if (t.beam2) scene.remove(t.beam2);
    for (const d of t.drones) scene.remove(d.mesh);
  }
  function towerStats(t) {
    const d = t.def, l = t.level - 1;
    const s = {
      dmg: d.dmg * LEVEL_DMG[l] * t.buffDmg,
      range: d.range > 0 ? d.range + LEVEL_RANGE[l] + t.buffRange : 0,
      rate: d.rate * LEVEL_RATE[l] * t.buffRate,
      speed: (d.speed || 10) * (1 + 0.08 * l),
      splash: (d.splash || 0) * (1 + 0.08 * l) * (t.level >= 5 && d.id === 'cannon' ? 1.5 : 1),
      slow: d.slow ? Math.min(0.8, d.slow * (1 + 0.1 * l)) : 0,
      chains: d.chains ? d.chains + Math.floor(l / 2) + (t.level >= 5 && d.id === 'tesla' ? 3 : 0) : 0,
      targets: (d.targets || 1) + (t.level >= 5 && (d.id === 'crystal' || d.id === 'multi') ? 2 : 0) + (t.level >= 5 && d.id === 'archer' ? 2 : 0),
      dot: (d.dot || 0) * LEVEL_DMG[l] * (t.level >= 5 && d.id === 'snake' ? 2 : 1),
      burn: (d.burn || 0) * LEVEL_DMG[l] * (t.level >= 5 && d.id === 'fire' ? 2 : 1),
      stun: (d.stun || 0) + (t.level >= 5 && d.id === 'shock' ? 0.6 : 0),
    };
    if (d.type === 'heal') s.healEvery = d.healEvery * (1 - 0.12 * l);
    if (d.type === 'gold') s.income = Math.round(d.income * (1 + 0.6 * l) * (t.level >= 5 ? 2 : 1));
    if (d.type === 'buff') { s.buffDmg = d.buffDmg * (1 + 0.5 * l); s.buffRate = d.buffRate * (1 + 0.5 * l); }
    if (d.type === 'aura') s.slow = Math.min(0.7, d.slow * (1 + 0.12 * l));
    return s;
  }
  function upgradeCost(t) { return t.level >= MAX_TOWER_LEVEL ? 0 : Math.round(t.def.cost * UPGRADE_COST[t.level - 1]); }
  function sellValue(t) { return Math.floor(Math.max(0, t.invested - t.def.cost) * 0.7); } // Upgrade-Münzen teilweise zurück
  function upgrade(t) {
    if (!t || t.level >= MAX_TOWER_LEVEL) return false;
    const c = upgradeCost(t);
    if (!R.mode.creative && R.coins < c) { ui.toast && ui.toast('Nicht genug Münzen', 'bad'); Audio2.play('error'); return false; }
    if (!R.mode.creative) R.coins -= c;
    t.invested += c; t.level++;
    Models.applyTowerLevel(t.mesh, t.level);
    popIn(t.mesh);
    if (t.def.type === 'drone' && t.level === 5) { addDrone(t, 2); addDrone(t, 3); }
    Particles.emit(t.mesh.position.x, 0.6, t.mesh.position.z, 40, '#ffe14d', { speed: 2.5, up: 3, life: 0.9, size: 0.3 });
    Audio2.play('upgrade');
    Save.addStat('upgrades'); Save.maxStat('maxTowerLevel', t.level);
    snapshotRun();
    ui.hud && ui.hud(); ui.towerPanel && ui.towerPanel(t);
    return true;
  }
  function sell(t) {
    if (!t) return;
    const v = sellValue(t);
    if (!R.mode.creative) { R.coins += v; }
    removeTowerMesh(t);
    towers.splice(towers.indexOf(t), 1);
    grid[t.x][t.z] = null;
    Particles.emit(t.mesh.position.x, 0.4, t.mesh.position.z, 20, '#ffd700', { speed: 2, up: 2, life: 0.6 });
    Audio2.play('sell'); Save.addStat('sold');
    floatText(t.mesh.position, v ? '↩ +' + v + ' 🪙' : '↩ ins Inventar', '#ffd84a');
    select(null); snapshotRun(); ui.hud && ui.hud();
  }
  function select(t) {
    selected = t;
    if (t) {
      selRing.visible = true; selRing.position.set(t.mesh.position.x, 0.2, t.mesh.position.z);
      const s = towerStats(t);
      if (s.range > 0) showRange(t.mesh.position, s.range, 0xffffff); else rangeRing.visible = false;
    } else { selRing.visible = false; if (!buildSel) rangeRing.visible = false; }
    ui.towerPanel && ui.towerPanel(t);
  }
  function startMove(t) { setBuild({ kind: 'move', tower: t, id: 'move' }); ui.toast && ui.toast('Tippe auf ein freies Feld, um den Turm zu verschieben'); }

  // ---------------- Gegner ----------------
  function hpScale(w) { return (1 + 0.07 * (w - 1)) * Math.pow(1.022, w - 1) * (w > 30 ? Math.pow(1.045, w - 30) : 1); }
  const BOSS_EVERY = 5;
  function isBossWave(w) { return w % BOSS_EVERY === 0; }
  function bossFor(w) { return w === BOSS_EVERY ? 'boss_tut' : BOSS_ORDER[(w / BOSS_EVERY - 2) % BOSS_ORDER.length]; }
  function bossHp(w) { return w === BOSS_EVERY ? 420 : 950 * Math.pow(1.42, (w - 10) / 5) * (w > 30 ? Math.pow(1.045, w - 30) : 1); }
  function spawnEnemy(def, wave, hpMul = 1, d0 = 0, waveTag = null) {
    if (!route) return null;
    const mesh = Models.makeEnemy(def);
    scene.add(mesh);
    const scale = demo ? 1 : hpScale(Math.max(1, wave)) * R.mode.hp * hpMul;
    const hp = Math.round(def.hp * scale);
    const e = {
      def, mesh, A: mesh.userData.A, hp, maxHp: hp, shield: def.shield ? def.shield * scale : 0, maxShield: def.shield ? def.shield * scale : 0,
      d: d0, speed: def.speed * (demo ? 1 : Math.min(1.45, 1 + wave * 0.005) * R.mode.speed), slowT: 0, slowF: 0, burnT: 0, burnDps: 0, poisonT: 0, poisonDps: 0,
      curseT: 0, curseF: 0, stunT: 0, alive: true, fly: !!def.fly, invis: !!def.invis, vanishT: 0, revealed: false, jumpT: 2 + Math.random() * 2, jumpAnim: 0,
      healT: 1, abilT: [4, 5, 6, 7], raged: false, reward: Math.round(def.reward * (1 + wave * 0.025)), wave: waveTag, pos: new V3(), dir: new V3(), anim: Math.random() * 10,
      hitFlash: 0,
    };
    World.routePos(route, e.d, e.pos, e.dir);
    mesh.position.copy(e.pos);
    enemies.push(e);
    if (!demo) {
      if (!Save.P.seen[def.id]) { Save.P.seen[def.id] = 1; Save.checkAchievements(); ui.newEnemy && ui.newEnemy(def); }
      if (def.boss) { R.boss = e; Audio2.play('boss'); Audio2.setMood('boss'); ui.bossAppear && ui.bossAppear(e); shake = 0.6; }
    }
    return e;
  }

  // Schaden mit Rüstung, Resistenzen, Immunitäten, Schild, Fluch
  function damage(e, amount, dt, tower, opt = {}) {
    if (!e.alive || amount <= 0) return 0;
    const def = e.def;
    if (def.immune && def.immune.includes(dt) && !(opt.ignoreImmune)) amount *= 0.1;
    if (def.resist && def.resist[dt]) amount *= 1 - def.resist[dt];
    if (def.armor && !opt.pierce) amount *= 1 - def.armor * (dt === 'explosive' ? 0.6 : 1);
    if (e.curseT > 0) amount *= 1 + e.curseF;
    if (e.shield > 0) { const ab = Math.min(e.shield, amount); e.shield -= ab; amount -= ab; if (e.shield <= 0 && e.A.shieldMesh) e.A.shieldMesh.visible = false; }
    e.hp -= amount; e.hitFlash = 0.08;
    if (tower) tower.dmgDealt += amount;
    if (!demo) Save.P.stats.damage += amount;
    if (e.hp <= 0) kill(e, tower);
    return amount;
  }
  function applySlow(e, f, t) {
    if (e.def.immune && (e.def.immune.includes('slow') || e.def.immune.includes('ice'))) return;
    if (e.def.boss) f *= 0.5;
    e.slowF = Math.max(e.slowF * (e.slowT > 0 ? 1 : 0), f); e.slowT = Math.max(e.slowT, t);
  }
  function applyStun(e, t) {
    if (e.def.boss) t *= 0.25; else if (e.def.mini) t *= 0.5;
    e.stunT = Math.max(e.stunT, t);
  }
  function kill(e, tower) {
    if (!e.alive) return;
    e.alive = false;
    const p = e.mesh.position;
    const col = e.def.color;

  // ---------------- Wellen ----------------
  function makeWave(w) {
    const list = [];
    const biome = BIOME_BY_ID[R.biome] || BIOMES[0];
    // Die ersten Wellen sind so gebaut, dass eine einzelne Armbrust sie schafft
    const early = { 1: ['grunt', 'grunt', 'grunt'], 2: ['grunt', 'grunt', 'grunt', 'grunt'], 3: ['grunt', 'runner', 'grunt', 'runner', 'grunt'], 4: ['grunt', 'grunt', 'runner', 'slug', 'grunt', 'runner'] };
    if (early[w]) { early[w].forEach(id => list.push({ id, hp: 1, delay: 1.6 })); return list; }
    if (isBossWave(w)) {
      const b = bossFor(w);
      const esc = w === BOSS_EVERY ? 2 : Math.min(14, 2 + Math.floor(w / 4));
      for (let i = 0; i < esc; i++) list.push({ id: w === BOSS_EVERY ? 'grunt' : pickEnemy(w, biome), hp: 1, delay: 1.0 });
      list.push({ id: b, hp: bossHp(w) / (ENEMY_BY_ID[b].hp * hpScale(w)), delay: 2.5 });
      return list;
    }
    const count = Math.min(45, 4 + Math.floor(w * 0.8));
    const interval = Math.max(0.35, 1.3 - w * 0.02);
    for (let i = 0; i < count; i++) list.push({ id: pickEnemy(w, biome), hp: 1, delay: Math.random() < 0.15 ? 0.25 : interval });
    if (w >= 40 && w % 7 === 0) list.push({ id: 'colossus', hp: 0.6, delay: 1.5 });
    return list;
  }
  function pickEnemy(w, biome) {
    const pool = ENEMIES.filter(e => !e.boss && e.w > 0 && e.min <= w && e.id !== 'miniboss' && e.id !== 'colossus');
    let tot = 0;
    const ws = pool.map(e => { const age = w - e.min; const wt = e.w * (biome.bias[e.id] || 1) * (age < 6 ? 1.6 : age > 25 ? 0.5 : 1); tot += wt; return wt; });

  // ---------------- Geschosse (Pool) ----------------
  const projPool = [];
  function projMesh(kind, color) {
    let p = projPool.find(m => !m.visible && m.userData.kind === kind);
    if (!p) {
      let g;
      switch (kind) {
        case 'arrow': g = new THREE.Group(); Models.mesh(Models.cyl(0.015, 0.015, 0.35, 4), Models.M('#8a5a2a'), 0, 0, 0, g, false).rotation.x = Math.PI / 2; Models.mesh(Models.cone(0.04, 0.1, 4), Models.M('#cccccc'), 0, 0, 0.2, g, false).rotation.x = Math.PI / 2; break;
        case 'rocket': g = new THREE.Group(); Models.mesh(Models.cyl(0.05, 0.05, 0.3, 6), Models.M('#dddddd'), 0, 0, 0, g, false).rotation.x = Math.PI / 2; Models.mesh(Models.cone(0.05, 0.12, 6), Models.M('#ff3b2b'), 0, 0, 0.21, g, false).rotation.x = Math.PI / 2; break;
        case 'meteor': g = new THREE.Group(); Models.mesh(Models.dod(0.35), Models.M('#5a2a1a', { e: '#ff5a00', ei: 0.8 }), 0, 0, 0, g, false); break;
        case 'bullet': g = new THREE.Group(); Models.mesh(Models.sph(0.04, 6), Models.M('#ffd24a', { e: '#ffaa00', ei: 1 }), 0, 0, 0, g, false); break;
        default: g = new THREE.Group(); g.userData.ball = Models.mesh(Models.sph(0.1, 10), new THREE.MeshBasicMaterial({ color }), 0, 0, 0, g, false);
      }

  function fire(t, target, s, opt = {}) {

    let kind = 'ball', color = d.c3, size = 1;
    if (d.id === 'archer') kind = 'arrow';
    else if (d.id === 'rocket') kind = 'rocket';
    else if (d.id === 'gatling') kind = 'bullet';
    else if (d.id === 'cannon' || d.id === 'multi' || d.id === 'bomb') { color = '#222222'; size = d.id === 'bomb' ? 2 : 1.3; }
    else if (opt.meteor) kind = 'meteor';
    const mesh = projMesh(kind, color);
    mesh.scale.setScalar(size * (1 + (t.level - 1) * 0.08));
    if (opt.meteor) { from.set(target.pos.x + 3, 12, target.pos.z - 2); }
    mesh.position.copy(from);
    projectiles.push({ mesh, tower: t, target, tp: target.pos.clone(), pos: from.clone(), start: from.clone(), speed: opt.meteor ? 11 : s.speed, dmg: opt.dmg ?? s.dmg, splash: s.splash, homing: true, lob: d.lob || d.id === 'mortar', t: 0, kind, color: d.c3, meteor: opt.meteor, dt: d.dt });
  }
  function updateProjectiles(dt) {
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      if (p.target && p.target.alive) p.tp.set(p.target.pos.x, p.target.pos.y + 0.35 + (p.target.fly ? 0.8 : 0), p.target.pos.z);
      const to = p.tp.clone().sub(p.pos);
      const dist = to.length();
      const step = p.speed * dt;
      if (p.lob) {
        p.t += dt * p.speed / Math.max(1, p.start.distanceTo(p.tp));
        const tt = Math.min(1, p.t);
        p.pos.lerpVectors(p.start, p.tp, tt); p.pos.y += Math.sin(tt * Math.PI) * 2;
        p.mesh.position.copy(p.pos);
        if (tt >= 1) { impact(p); projectiles.splice(i, 1); }
        continue;
      }
      if (dist <= step + 0.05) { p.pos.copy(p.tp); impact(p); projectiles.splice(i, 1); continue; }

      else if (p.kind === 'ball' && Math.random() < 0.5) Particles.emit(p.pos.x, p.pos.y, p.pos.z, 1, p.color, { speed: 0.1, up: 0.1, life: 0.25, size: 0.18, gravity: 0 });
    }
  }
  function impact(p) {
    p.mesh.visible = false;
    const t = p.tower, d = t.def, s = towerStats(t);
    const pos = p.pos;
    const hitList = [];
    if (p.splash > 0) {
      for (const e of enemies) if (e.alive && dist2(e.pos, pos) <= p.splash * p.splash && (!d.ground || !e.fly) && (!e.invis || e.revealed)) hitList.push(e);
      const col = d.dt === 'poison' ? '#9dff3d' : d.dt === 'energy' ? d.c3 : d.dt === 'fire' ? '#ff7a00' : '#ffb347';
      Particles.emit(pos.x, Math.max(0.2, pos.y), pos.z, p.meteor ? 70 : 26, col, { speed: p.splash * 3, up: 2, life: 0.6, size: 0.32 });
      if (d.dt === 'explosive' || p.meteor) { Particles.emit(pos.x, 0.3, pos.z, 12, '#555555', { speed: 1, up: 1.2, life: 1.0, size: 0.5, gravity: -0.5, tint: false }); Audio2.play('explosion'); }
      ring(pos, p.splash, col, 0.35);

    for (const e of hitList) {
